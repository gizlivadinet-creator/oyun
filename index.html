    <title>SosyalArena — Sosyal Etkileşim Oyunu</title>
    <script type="text/javascript">
      // GitHub Pages SPA yönlendirme: 404.html tarafından query string'e
      // kodlanan gerçek path'i History API ile geri yükler (bkz. public/404.html).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
